<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Helper AI – Einstellungen</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      body {
        margin: 0;
        padding: 32px 16px;
      }

      main {
        width: min(640px, 100%);
        margin: 0 auto;
        padding: 28px;
        background: #ffffff;
        border: 1px solid #d8dee8;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(15 23 42 / 8%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .intro,
      .hint,
      .status {
        color: #526176;
        line-height: 1.5;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-top: 24px;
      }

      label {
        font-weight: 650;
      }

      input {
        min-height: 42px;
        padding: 0 12px;
        color: #172033;
        background: #ffffff;
        border: 1px solid #b8c3d4;
        border-radius: 8px;
        font: inherit;
      }

      input:focus-visible {
        outline: 3px solid #bfdbfe;
        outline-offset: 1px;
        border-color: #60a5fa;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        min-height: 38px;
        padding: 0 14px;
        color: #172033;
        background: #f8fafc;
        border: 1px solid #b8c3d4;
        border-radius: 8px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button.primary {
        color: #ffffff;
        background: #2563eb;
        border-color: #2563eb;
      }

      button.danger {
        color: #991b1b;
        background: #fef2f2;
        border-color: #fecaca;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status {
        min-height: 24px;
        margin-top: 16px;
      }

      .status.success {
        color: #166534;
      }

      .status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Web Helper AI – Einstellungen</h1>
      <p class="intro">Verwalten Sie hier den Schlüssel für die konfigurierte KI-API.</p>
      <p class="hint">Der Schlüssel wird ausschließlich lokal in der Chrome-Erweiterung gespeichert. Er wird nach dem Speichern nicht wieder angezeigt.</p>

      <form id="api-key-form">
        <div class="field">
          <label for="api-key">KI-API-Schlüssel</label>
          <input id="api-key" name="api-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="Schlüssel eingeben">
        </div>
        <div class="actions">
          <button class="primary" type="submit">Speichern</button>
          <button id="delete-key" class="danger" type="button" disabled>Löschen</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite">Status: wird geprüft ...</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
